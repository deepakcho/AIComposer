    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://deepakcho.github.io/AIComposer/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Composer" />

      content="AI Composer — Pluggable AI input for every framework"

      content="Ship rich AI input experiences without building the editor plumbing. Explore live demos, framework adapters, and API docs."
    />
    <meta name="twitter:card" content="summary" />

      name="twitter:title"
      content="AI Composer — Pluggable AI input for every framework"
    />
    <meta
      name="twitter:description"
      content="A framework-agnostic, pluggable TypeScript composer for React, Vue, Angular, Web Components, and vanilla JavaScript."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "AI Composer",
        "description": "A framework-agnostic, pluggable TypeScript composer for building rich AI input experiences.",
        "url": "https://deepakcho.github.io/AIComposer/",
        "codeRepository": "https://github.com/deepakcho/AIComposer",
        "programmingLanguage": "TypeScript",
        "runtimePlatform": "React, Vue, Angular, Web Components, and vanilla JavaScript",
        "license": "https://opensource.org/license/mit"
      }
    </script>
    <link
      rel="preload"
      href="/fonts/GeistVF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMonoVF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>AI Composer — Framework-agnostic AI composition editor</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        var theme = localStorage.getItem('aic-docs-theme');
        var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.setAttribute('data-aic-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>AI Composer</h1>
        <p>
          Ship the AI Composer. Skip the plumbing. AI Composer is a framework-agnostic,
          pluggable TypeScript input component for building rich AI experiences with React, Vue,
          Angular, Web Components, and vanilla JavaScript.
        </p>
        <p>
          Explore the <a href="https://github.com/deepakcho/AIComposer">source on GitHub</a> and
          browse the <a href="https://www.npmjs.com/org/ai-composer">AI Composer packages on npm</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
