<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Composer — a framework-agnostic AI composition editor. API documentation and live demos on a single page."
    />
    <link
      rel="preload"
      href="/fonts/GeistVF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMonoVF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>AI Composer — Framework-agnostic AI composition editor</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        var theme = localStorage.getItem('aic-docs-theme');
        var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.setAttribute('data-aic-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
