<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Composer · Web Component example</title>
    <!-- In an app: import from node_modules / your CDN bundle -->
    <script type="module">
      import { defineAiComposerEditor } from '@ai-composer/web-component';
      import { mentionPlugin } from '@ai-composer/plugin-mention';
      import '@ai-composer/themes/css/tokens.css';
      import '@ai-composer/themes/css/default.css';
      import '@ai-composer/themes/css/dark.css';

      defineAiComposerEditor();

      // Optional: configure plugins before the element connects.
      document.querySelectorAll('ai-composer-editor').forEach((element) => {
        element.plugins = [
          mentionPlugin({
            items: [
              { id: 'u1', label: 'Ada Lovelace', description: 'Engineering' },
              { id: 'u2', label: 'Grace Hopper', description: 'Engineering' },
            ],
          }),
        ];
      });

      // Events (CustomEvent, detail = editor event payload):
      document.querySelector('#editor').addEventListener('aic-submit', (event) => {
        console.log('submitted', event.detail.value);
      });
    </script>
  </head>
  <body>
    <!-- attributes -->
    <ai-composer-editor
      id="editor"
      mode="chat"
      placeholder="Ask anything… try @ad"
    ></ai-composer-editor>

    <script type="module">
      const element = document.querySelector('#editor');

      // properties
      element.value = JSON.stringify({ nodes: [{ type: 'text', key: 't1', text: 'Prefilled' }] });

      // the underlying editor (full core API):
      console.log(element.editor.serialize('text'));
    </script>
  </body>
</html>
