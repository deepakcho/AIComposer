<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Composer · Vanilla JS example</title>
    <script type="module">
      import { createPromptEditor } from '@ai-composer/core';
      import { mountPromptEditor } from '@ai-composer/dom';
      import { mentionPlugin } from '@ai-composer/plugin-mention';
      import '@ai-composer/themes/css/tokens.css';
      import '@ai-composer/themes/css/default.css';

      const editor = createPromptEditor({
        mode: 'chat',
        placeholder: 'No framework required',
        plugins: [
          mentionPlugin({ items: [{ id: 'u1', label: 'Ada Lovelace' }] }),
        ],
        submit: {
          clearOnSubmit: true,
          onSubmit: (value) => console.log('submit', value),
        },
      });

      // The vanilla mount — proves the stack has zero framework coupling.
      const mounted = mountPromptEditor(document.querySelector('#composer'), editor, {
        mode: 'chat',
      });

      // Full API access:
      editor.subscribe((state) => {
        console.log('text:', editor.serialize('text'), 'canUndo:', state.canUndo);
      });

      // later: mounted.destroy();
      window.editor = editor; // explore in DevTools
      void mounted;
    </script>
  </head>
  <body>
    <div id="composer" style="max-width: 640px; margin: 40px auto"></div>
  </body>
</html>
