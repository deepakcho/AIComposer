name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (affected)
        run: pnpm exec nx affected -t lint --base=origin/main

      - name: Typecheck (affected)
        run: pnpm exec nx affected -t typecheck --base=origin/main

      - name: Unit + contract tests (affected)
        run: pnpm exec nx affected -t test --base=origin/main

      - name: Build (affected)
        run: pnpm exec nx affected -t build --base=origin/main

      - name: Bundle size check
        run: pnpm exec nx affected -t build --base=origin/main -- -c --check-size || true
        continue-on-error: true

      # TODO Phase 11: E2E (Playwright), a11y audit, visual regression
